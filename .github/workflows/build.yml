# push is scoped to main so a branch with an open PR doesn't run the whole
# suite twice (the pull_request event covers it); superseded runs cancel.
# Note: a branch pushed WITHOUT a PR gets no CI until one opens.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Build and Test

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Install the nightly pinned by rust-toolchain.toml so the toolchain CI sets up
      # matches the one cargo actually uses in the repo (the toolchain file otherwise
      # silently overrides a stable pin here, wasting the setup and its cached components).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-22
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, rust-src
      # Cell builds pin their own toolchains (cell_toolchain in ironpad-app's
      # compiler/build.rs; keep in sync here and in docker/Dockerfile). The
      # integration tests compile real cells, so the runner needs both:
      #   nightly-2026-07-14 — normal + SIMD cells (CELL_TOOLCHAIN)
      #   nightly-2026-06-01 — std::autodiff cells (AUTODIFF_TOOLCHAIN), + enzyme
      # Rayon cells use nightly-2025-12-22, already installed above.
      - run: |
          rustup toolchain install nightly-2026-07-14 --profile minimal \
            --target wasm32-unknown-unknown \
            --component rust-src
          rustup toolchain install nightly-2026-06-01 --profile minimal \
            --target wasm32-unknown-unknown \
            --component rust-src --component enzyme
      # Linux cells (PRD-0066) build on a vendor-supplied toolchain, not a
      # rustup channel: the pack ships a prebuilt std ABI-tied to
      # nightly-2026-05-19, so no other rustc can use it. `test-integration`
      # compiles real Linux cells, and without this the two e2e tests fail
      # with "toolchain 'browserpod-3.0.0' is not installed" rather than
      # skipping. The `docker` job vendors this too, on a different runner.
      - name: Install the BrowserPod cell toolchain
        run: |
          bash docker/vendor-browserpod.sh
          sh -c "cd /tmp && tar -xzf $GITHUB_WORKSPACE/docker/vendor/browserpod-rust-3.0.0.tar.gz && sh /tmp/browserpod-rust-3.0.0/install.sh"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
      - uses: cargo-bins/cargo-binstall@main
      # wasm-bindgen-cli is pinned to the workspace's locked wasm-bindgen crate version
      # (0.2.114) — the compiler pipeline shells out to `wasm-bindgen` (build.rs) during
      # the integration tests, so it must be on PATH and version-matched to the lockfile.
      # --force: rust-cache restores binstall's install manifest (.crates.toml) without
      # the binaries, so a plain binstall would skip them and cargo then reports e.g.
      # "no such command: make". Forcing a reinstall keeps the binaries present.
      - run: cargo binstall -y --force cargo-make cargo-nextest wasm-bindgen-cli@0.2.114
      - run: cargo make ci
      # Run the real gate: the #[ignore]'d compiler-pipeline integration tests and a
      # wasm/hydrate compile check, so green CI means the WASM frontend actually builds.
      - run: cargo make test-integration
      - name: Wasm frontend compile check (hydrate)
        run: cargo build -p ironpad-app --no-default-features --features hydrate --target wasm32-unknown-unknown

      - name: Notify channel
        if: always() && github.event_name == 'push'
        env:
          CHANNEL_PRIVATE_KEY: ${{ secrets.CHANNEL_PRIVATE_KEY }}
        run: |
          STATUS="${{ job.status }}"
          BODY=$(cat <<EOF
          ironpad build #${{ github.run_number }} on ${{ github.ref_name }} (${{ github.sha }}): ${STATUS}
          Commit: ${{ github.event.head_commit.message }}
          Author: ${{ github.event.head_commit.author.name }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          TIMESTAMP=$(date +%s)
          KEYFILE=$(mktemp)
          echo "$CHANNEL_PRIVATE_KEY" | base64 -d > "$KEYFILE"
          DATAFILE=$(mktemp)
          printf '%s' "${TIMESTAMP}.${BODY}" > "$DATAFILE"
          SIGNATURE=$(openssl pkeyutl -sign -rawin -inkey "$KEYFILE" -in "$DATAFILE" | base64 -w0)
          rm -f "$KEYFILE" "$DATAFILE"
          curl -sS -w "\nHTTP %{http_code}" -X POST "https://channel.server.sno.twitchax.com/github" \
            -H "X-Channel-Key-Id: github-ironpod" \
            -H "X-Channel-Timestamp: ${TIMESTAMP}" \
            -H "X-Channel-Signature: ${SIGNATURE}" \
            -d "${BODY}" || echo "Channel notification failed (non-fatal)"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: cargo-bins/cargo-binstall@main
      # Audit the locked dependency tree against the RUSTSEC advisory database.
      # cargo-audit reads Cargo.lock directly and needs no config, so it can't fail
      # on license/bans policy that can't be validated offline.
      - run: cargo binstall -y cargo-audit
      - run: cargo audit

  codecov:
    needs: test
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the active toolchain to nightly-2025-12-22, so install
      # that directly (a stable pin here is silently overridden) with llvm-tools-preview —
      # cargo-llvm-cov needs it on the *active* toolchain to find llvm-profdata/llvm-cov.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-22
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
      - uses: cargo-bins/cargo-binstall@main
      # --force reinstalls even when rust-cache restored a stale install record
      # (.crates2.json) without the binary, which otherwise makes binstall skip
      # cargo-llvm-cov and cargo then reports "no such command: llvm-cov".
      - run: cargo binstall -y --force cargo-llvm-cov cargo-nextest
      - run: cargo llvm-cov nextest --workspace --lcov --output-path coverage.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: twitchax/ironpad

  # NOTE: Playwright smoke tests are available locally (`cargo make playwright`)
  # but skipped in CI — each test compiles real Rust notebooks from scratch
  # (crate downloads + WASM compilation) which exceeds reasonable CI timeouts.

  docker:
    needs: test
    name: Docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The image installs the BrowserPod toolchain from docker/vendor/ rather
      # than piping the vendor's install.sh to a shell, so a 20-minute image
      # build cannot fail on somebody else's CDN (PRD-0066 T-012). The tarball
      # is 38MB and gitignored, so the checkout ships the directory empty and
      # this step fills it. Checksum-verified and idempotent.
      - name: Vendor the BrowserPod toolchain
        run: bash docker/vendor-browserpod.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/twitchax/ironpad:latest
            ghcr.io/twitchax/ironpad:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
