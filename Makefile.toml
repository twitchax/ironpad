# ── ironpad — cargo-make task definitions ────────────────────────────────────
#
# Quick reference:
#   cargo make dev           — Start cargo-leptos watch (dev server with live reload)
#   cargo make build         — Release build via cargo-leptos
#   cargo make ci            — fmt-check + gen-completions-check + clippy + test
#   cargo make uat           — ci + playwright (the one true gate)
#   cargo make test          — Run unit/integration tests via cargo nextest
#   cargo make test-linux-cells — Pod-booting e2e specs (opt-in; costs metered
#                                 BrowserPod allowance, never run by ci/uat)
#   cargo make fmt           — Auto-format all code
#   cargo make clippy        — Run clippy lints

[config]
default_to_workspace = false

# ── Tool Installation ────────────────────────────────────────────────────────

[tasks.install-tools]
description = "Install required development tools"
script = '''
#!/usr/bin/env bash
set -euo pipefail

echo "==> Installing cargo-binstall (if needed)..."
command -v cargo-binstall >/dev/null 2>&1 || cargo install cargo-binstall

echo "==> Installing cargo-nextest..."
cargo binstall cargo-nextest --no-confirm --force 2>/dev/null || cargo install cargo-nextest

echo "==> Installing cargo-leptos..."
cargo binstall cargo-leptos --no-confirm --force 2>/dev/null || cargo install cargo-leptos

echo "==> Installing cargo-make..."
cargo binstall cargo-make --no-confirm --force 2>/dev/null || cargo install cargo-make

echo "==> Installing wasm-bindgen-cli..."
# Pinned to match the workspace's locked `wasm-bindgen` crate version. cargo-leptos
# runs this CLI to post-process the app's frontend WASM, and wasm-bindgen requires
# the crate and CLI schema versions to match exactly (`cargo make dev/build/playwright`
# fail otherwise). Cell compiles pin their scaffolded wasm-bindgen to this CLI version
# automatically (PRD-0031 T-002). When bumping the workspace `wasm-bindgen`, bump this too.
cargo binstall wasm-bindgen-cli --version 0.2.127 --no-confirm --force 2>/dev/null || cargo install wasm-bindgen-cli --version 0.2.127

echo "==> Adding wasm32-unknown-unknown target..."
rustup target add wasm32-unknown-unknown 2>/dev/null || true

echo "==> Adding llvm-tools-preview component..."
rustup component add llvm-tools-preview 2>/dev/null || true

echo "==> Adding rust-src component (needed for -Zbuild-std on atomics/rayon cells)..."
rustup component add rust-src 2>/dev/null || true

echo "==> Installing Playwright browsers..."
if command -v npx >/dev/null 2>&1 && [ -f package.json ]; then
    npx playwright install --with-deps chromium
else
    echo "    (skipped — no package.json or npx not found)"
fi

echo "==> All tools installed."
'''

# ── Monaco Setup ─────────────────────────────────────────────────────────────

[tasks.setup-monaco]
description = "Install monaco-editor from npm and copy dist to public/monaco/"
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f package.json ]; then
    echo "No package.json found — skipping Monaco setup."
    exit 0
fi

echo "==> Installing npm dependencies..."
npm install --no-audit --no-fund

echo "==> Copying Monaco dist to public/monaco/..."
rm -rf public/monaco/vs
mkdir -p public/monaco
cp -r node_modules/monaco-editor/min/vs public/monaco/

echo "==> Monaco setup complete."
'''

# ── Dev Server ───────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start cargo-leptos watch (dev server with live reload)"
dependencies = ["setup-monaco"]
command = "cargo"
args = ["leptos", "watch"]

# ── Build ────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Release build via cargo-leptos"
dependencies = ["setup-monaco"]
command = "cargo"
args = ["leptos", "build", "--release"]

# ── Formatting ───────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Auto-format all Rust code"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
description = "Check Rust formatting (no changes)"
command = "cargo"
args = ["fmt", "--all", "--check"]

# ── Clippy ───────────────────────────────────────────────────────────────────

[tasks.gen-completions]
description = "Regenerate the Monaco completions index from ironpad-cell's source"
command = "python3"
args = ["tools/gen-completions.py"]

[tasks.gen-completions-check]
description = "Fail if the committed completions index is stale vs ironpad-cell's source"
command = "python3"
args = ["tools/gen-completions.py", "--check"]

[tasks.capture-outputs]
description = "Capture saved outputs into public notebooks (requires a server on :3111; pass names after -- for a subset)"
command = "node"
args = ["tools/capture-outputs.mjs", "${@}"]

[tasks.glyph-check]
description = "Fail if a bare Unicode symbol glyph is rendered instead of an icon"
command = "python3"
args = ["tools/glyph-check.py"]

[tasks.css-vars-check]
description = "Fail if the stylesheet reads a CSS custom property nobody defines"
command = "python3"
args = ["tools/css-vars-check.py"]

[tasks.capture-outputs-check]
description = "Fail if a public notebook's code changed without an output recapture"
command = "python3"
args = ["tools/capture-outputs-check.py"]

[tasks.warm-prod]
description = "Converge a deployed instance's compile/check caches (post-deploy)"
command = "bash"
args = ["tools/warm-prod.sh"]

[tasks.clippy]
description = "Run clippy lints on all targets"
command = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

# ── Tests ────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run unit/integration tests via cargo nextest"
command = "cargo"
args = ["nextest", "run", "--no-tests=pass"]

[tasks.test-integration]
description = "Run slow integration tests (requires wasm32-unknown-unknown toolchain)"
command = "cargo"
args = ["nextest", "run", "--run-ignored=ignored-only", "--no-tests=pass"]

# ── CI (fmt-check + clippy + test) ───────────────────────────────────────────

# The pod runtime is JavaScript, so its logic is unreachable from `cargo
# test`. These drive the real `public/browserpod-runtime.js` against a fake
# SDK — no browser, no network, and **no metered pod boot** (the single
# dynamic `import()` is patched at a site the harness asserts it matched, so
# a moved line fails loudly instead of silently testing nothing).
#
# In `ci` deliberately: six of these fail against the pre-fix runtime and
# cover terminate-during-boot, terminate-during-write, the stale-boot race,
# the reporting horizon and the teardown grace. Left out of the gate they
# would be a file rather than coverage.
[tasks.test-js]
description = "Run the JS unit tests for the pod runtime (no browser, no pod boots)"
command = "node"
args = ["--test", "tests/js/*.test.mjs"]

[tasks.ci]
description = "Full CI check: fmt-check → gen-completions-check → capture-outputs-check → glyph-check → css-vars-check → clippy → test → test-js"
dependencies = [
    "fmt-check",
    "gen-completions-check",
    "capture-outputs-check",
    "glyph-check",
    "css-vars-check",
    "clippy",
    "test",
    "test-js",
]

# ── CLI Build ───────────────────────────────────────────────────────────

[tasks.build-cli]
description = "Build the ironpad-cli binary (release)"
command = "cargo"
args = ["build", "--release", "-p", "ironpad-cli"]

[tasks.warmup-atomics]
description = "Pre-build std with atomics support for rayon cells (one-time, ~30-60s)"
script = '''
#!/usr/bin/env bash
set -euo pipefail

# Determine the cache directory (same logic as the server).
CACHE_DIR="${IRONPAD_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/ironpad}"
TARGET_DIR="$CACHE_DIR/targets/atomics-shared"

echo "==> Pre-building std with atomics support..."
echo "    Target dir: $TARGET_DIR"

# Create a temporary micro-crate that depends on ironpad-cell + rayon.
TMPDIR=$(mktemp -d)
trap 'rm -rf "$TMPDIR"' EXIT

cp -r crates/ironpad-cell "$TMPDIR/crates/ironpad-cell"
cp docker/warmup-atomics-Cargo.toml "$TMPDIR/Cargo.toml"
mkdir -p "$TMPDIR/src"
echo "" > "$TMPDIR/src/lib.rs"

cd "$TMPDIR"
CARGO_TARGET_DIR="$TARGET_DIR" \
    RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals \
               -C link-arg=--shared-memory \
               -C link-arg=--max-memory=2147483648 \
               -C link-arg=--import-memory \
               -C link-arg=--export=__wasm_init_tls \
               -C link-arg=--export=__tls_size \
               -C link-arg=--export=__tls_align \
               -C link-arg=--export=__tls_base" \
    cargo +nightly build --target wasm32-unknown-unknown --release \
    -Zbuild-std=std,panic_abort

echo "==> Atomics sysroot pre-built at: $TARGET_DIR"
echo "    Rayon cells will now compile without rebuilding std."
'''

# ── Playwright ───────────────────────────────────────────────────────────────

[tasks.playwright-install]
description = "Install Playwright browsers"
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f package.json ]; then
    echo "No package.json found — skipping Playwright install."
    exit 0
fi

npx playwright install --with-deps chromium
'''

[tasks.playwright]
description = "Run Playwright end-to-end tests (args after -- are passed through, e.g. a name filter)"
dependencies = ["build-cli"]
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f playwright.config.ts ] && [ ! -f playwright.config.js ]; then
    echo "No playwright config found — skipping Playwright tests."
    echo "(Playwright tests will run once T-045 sets up the test infrastructure.)"
    exit 0
fi

if [ ! -d tests/e2e ] || [ -z "$(find tests/e2e -name '*.spec.*' -o -name '*.test.*' 2>/dev/null)" ]; then
    echo "No Playwright test files found in tests/e2e/ — skipping."
    exit 0
fi

# cargo-make hands the task's own `--` through as a positional arg; drop it
# so `cargo make playwright -- embed` reads as a Playwright name filter. `$@`
# stays quoted, or a filter with a space in it arrives as two arguments.
if [ "$#" -gt 0 ] && [ "$1" = "--" ]; then shift; fi

# The `chromium` project only. It ignores tests/e2e/linux-pod/ AND launches
# with rt.browserpod.io unresolvable, so this task — and therefore `uat` and
# CI — can never spend a metered BrowserPod boot (PRD-0066 T-014).
npx playwright test --project=chromium "$@"
'''

[tasks.test-linux-cells]
description = "Run the pod-booting Linux-cell e2e specs (OPT-IN: each boot spends metered BrowserPod allowance)"
dependencies = ["build-cli"]
script = '''
#!/usr/bin/env bash
set -euo pipefail

# Deliberately NOT part of `ci` or `uat`, for the same reason
# `test-integration` is separated for being slow — except the cost here is
# money rather than minutes. A boot is 10 tokens of a ~1,000-boot monthly
# allowance, flat and duration-independent, so the bill tracks how many times
# these specs run and nothing else. See tests/e2e/linux-pod/README.md.
echo "==> Linux-cell e2e: these specs BOOT REAL PODS (~10 tokens each)."
echo "    Not run by \`cargo make uat\` or CI. See tests/e2e/linux-pod/README.md."

if [ -z "$(find tests/e2e/linux-pod -name '*.spec.*' 2>/dev/null)" ]; then
    echo "    No pod-booting specs yet — nothing to run."
    exit 0
fi

if [ "$#" -gt 0 ] && [ "$1" = "--" ]; then shift; fi

# IRONPAD_LINUX_POD_TESTS is what brings the `linux-pod` project into
# existence at all; without it the config does not define it, which is why a
# stray `npx playwright test` cannot reach these.
IRONPAD_LINUX_POD_TESTS=1 npx playwright test --project=linux-pod "$@"
'''

# ── UAT (the one true gate) ─────────────────────────────────────────────────

[tasks.uat]
description = "UAT: ci + integration tests + playwright (the one true gate; never boots a BrowserPod pod)"
dependencies = ["ci", "test-integration", "playwright"]

# ── Coverage ─────────────────────────────────────────────────────────────────

[tasks.coverage]
description = "Generate code coverage report via cargo-llvm-cov"
script = '''
#!/usr/bin/env bash
set -euo pipefail

command -v cargo-llvm-cov >/dev/null 2>&1 || {
    echo "==> Installing cargo-llvm-cov..."
    cargo install cargo-llvm-cov
}

echo "==> Running coverage..."
cargo llvm-cov nextest --workspace --lcov --output-path coverage.lcov
echo "==> Coverage report written to coverage.lcov"
'''

# ── Docker ───────────────────────────────────────────────────────────────────

[tasks.vendor-browserpod]
description = "Fetch + verify the BrowserPod toolchain tarball into docker/vendor/ (38MB, gitignored)"
command = "bash"
args = ["docker/vendor-browserpod.sh"]

[tasks.docker-build]
description = "Build the Docker image"
# Vendors the BrowserPod toolchain first so the image build itself never talks
# to rt.browserpod.io (PRD-0066 T-012). Idempotent — a verified tarball already
# on disk is a no-op.
dependencies = ["vendor-browserpod"]
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f Dockerfile ] && [ ! -f docker/Dockerfile ]; then
    echo "No Dockerfile found — skipping Docker build."
    echo "(Docker build will work once T-004 creates the Dockerfile.)"
    exit 0
fi

if [ -f docker/Dockerfile ]; then
    docker build -f docker/Dockerfile -t ironpad .
elif [ -f Dockerfile ]; then
    docker build -t ironpad .
fi
'''

[tasks.docker-up]
description = "Start the Docker container via docker-compose"
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f docker-compose.yml ] && [ ! -f docker/docker-compose.yml ]; then
    echo "No docker-compose.yml found — skipping."
    echo "(Docker compose will work once T-004 creates docker-compose.yml.)"
    exit 0
fi

if [ -f docker/docker-compose.yml ]; then
    docker compose -f docker/docker-compose.yml up -d
else
    docker compose up -d
fi
'''

[tasks.docker-down]
description = "Stop the Docker container via docker-compose"
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f docker-compose.yml ] && [ ! -f docker/docker-compose.yml ]; then
    echo "No docker-compose.yml found — skipping."
    exit 0
fi

if [ -f docker/docker-compose.yml ]; then
    docker compose -f docker/docker-compose.yml down
else
    docker compose down
fi
'''

[tasks.docker-uat]
description = "Build Docker image, start container, run playwright, tear down"
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f Dockerfile ] && [ ! -f docker/Dockerfile ]; then
    echo "No Dockerfile found — skipping Docker UAT."
    echo "(Docker UAT will work once T-004 creates the Docker setup.)"
    exit 0
fi

echo "==> Building Docker image..."
cargo make docker-build

echo "==> Starting container..."
cargo make docker-up

echo "==> Waiting for server to be ready..."
for i in $(seq 1 30); do
    if curl -s http://localhost:3111 > /dev/null 2>&1; then
        echo "    Server is ready."
        break
    fi
    if [ "$i" -eq 30 ]; then
        echo "    ERROR: Server did not start within 30s."
        cargo make docker-down
        exit 1
    fi
    sleep 1
done

echo "==> Running Playwright tests against container..."
cargo make playwright || { cargo make docker-down; exit 1; }

echo "==> Tearing down container..."
cargo make docker-down

echo "==> Docker UAT passed."
'''
