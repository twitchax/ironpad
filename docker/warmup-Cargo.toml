# Warmup Cargo.toml — used during Docker build to pre-download
# ironpad-cell's transitive dependencies into the cargo registry cache.
# This avoids a download step on the first user cell compile.

# ironpad-cell inherits `[lints] workspace = true`; without a workspace root
# defining `workspace.lints` here, the whole warmup build fails to parse the
# manifest (and used to do so SILENTLY behind `|| true`, leaving images with
# no pre-warmed cache at all). Empty lint tables satisfy the inheritance.
[workspace]
members = ["crates/ironpad-cell"]

[workspace.lints.rust]

[workspace.lints.clippy]

[package]
name = "ironpad-warmup"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ironpad-cell = { path = "crates/ironpad-cell" }

# The profile every new notebook builds with (DEFAULT_SHARED_CARGO_TOML), and
# edition 2024 above, both as the scaffold writes them: cargo fingerprints
# dependencies by profile, so a warmup built any other way leaves artifacts the
# first cell recompiles from scratch. `warmup_manifests_match_the_default_notebook_profile`
# in compiler/build.rs holds the two together. wasm-bindgen is pinned to the
# image's CLI by the Dockerfile at build time, as the scaffold pins it.
[profile.release]
opt-level = 1
lto = false
codegen-units = 16
