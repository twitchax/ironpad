services:
  ironpad:
    # Run the image `cargo make docker-build` produces. Without this, compose
    # builds and caches its OWN tag (docker-ironpad) on first `up` and reuses
    # it forever — docker-uat spent months testing a stale container.
    image: ironpad:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3111:3111"
    volumes:
      - ironpad:/ironpad
    environment:
      - IRONPAD_DATA_DIR=/ironpad/data
      - IRONPAD_CACHE_DIR=/ironpad/cache
      - IRONPAD_PORT=3111
      - IRONPAD_CELL_PATH=/app/crates/ironpad-cell
      - RUST_LOG=info
    restart: unless-stopped

volumes:
  ironpad:
