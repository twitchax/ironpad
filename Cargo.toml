[workspace]
resolver = "2"
members = [
    "crates/ironpad-app",
    "crates/ironpad-cli",
    "crates/ironpad-frontend",
    "crates/ironpad-proxy",
    "crates/ironpad-server",
    "crates/ironpad-cell",
    "crates/ironpad-common",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

# ── Shared Dependencies ──────────────────────────────────────────────────────

[workspace.dependencies]

# Leptos ecosystem
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8" }

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
http = "1"


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "2"

# Hashing & crypto
blake3 = "1"
rand = "0.9"

# Accounts database (embedded, SurrealKV file backend on the data mount)
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry (opt-in OTLP trace + log export; rustls + bundled webpki roots so
# no system OpenSSL / cert store is needed in the slim runtime container)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls-webpki-roots",
] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"

# Identifiers and time
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }

# WASM interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Async utilities
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Internal crates
ironpad-app = { path = "crates/ironpad-app", default-features = false }
ironpad-frontend = { path = "crates/ironpad-frontend" }
ironpad-server = { path = "crates/ironpad-server" }
ironpad-cell = { path = "crates/ironpad-cell" }
ironpad-common = { path = "crates/ironpad-common" }

# ── cargo-leptos metadata ────────────────────────────────────────────────────

[[workspace.metadata.leptos]]
name = "ironpad"
bin-package = "ironpad-server"
lib-package = "ironpad-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
# Content-hash the pkg bundle (ironpad.<hash>.{js,wasm,css}) so browsers can
# never reuse a stale WASM across releases: unhashed assets with no
# Cache-Control let a pre-shared-cells bundle linger in heuristic caches and
# silently drop newer notebook fields. hash.txt must ship next to the server
# binary in deploy images (leptos reads it relative to current_exe).
hash-files = true
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3111"
reload-port = 3112
end2end-cmd = "npx playwright test"
end2end-dir = "tests/e2e"
browserquery = "defaults"

bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false

# ── Workspace Lints ───────────────────────────────────────────────────────────

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Style preferences — not bugs, just noisy.
module_name_repetitions = "allow"
wildcard_imports = "allow"

# Doc lints — impractical to retroactively document every fallible/panicking fn.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# must_use everywhere has diminishing returns for an application crate.
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# Subjective complexity lints — some functions are legitimately long or bool-heavy.
too_many_lines = "allow"
struct_excessive_bools = "allow"
