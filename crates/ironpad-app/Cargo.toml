[package]
name = "ironpad-app"
version = "0.13.2"
edition = "2021"

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }

ironpad-common = { workspace = true }

pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["HtmlElement", "HtmlDivElement", "HtmlAnchorElement", "HtmlInputElement", "HtmlSelectElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Window", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "EventTarget", "Storage", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Location", "File", "FileList", "FileReader", "Response"] }

http.workspace = true
thiserror.workspace = true
anyhow = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
subtle = { version = "2", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
bincode = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
ammonia = "4"

[dev-dependencies]
tempfile = "3"
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:serde", "dep:serde_json", "dep:serde-wasm-bindgen", "dep:bincode", "dep:uuid", "dep:chrono"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:anyhow",
    "dep:uuid",
    "dep:tokio",
    "dep:tracing",
    "dep:blake3",
    "dep:subtle",
    "dep:serde",
    "dep:serde_json",
    "dep:chrono",
    "dep:libc",
]

[lints]
workspace = true
